name: Linter and unit test
permissions:
  contents: read
on: push

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npm test
